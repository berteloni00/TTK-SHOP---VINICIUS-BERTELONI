async function cloudAuthenticate(event){event.preventDefault();if(!cloud.api){cloudMessage('A biblioteca de conexão não carregou. Confira a internet e recarregue a página.',true);return}const form=event.target,password=document.querySelector('#cloudPassword').value,email=document.querySelector('#cloudEmail')?.value.trim();if(document.querySelector('#cloudConfirm')&&password!==document.querySelector('#cloudConfirm').value){cloudMessage('As senhas não coincidem.',true);return}const submit=form.querySelector('button');submit.disabled=true;cloudMessage('Conectando…');try{if(cloud.mode==='recovery'){const {error}=await cloud.api.auth.updateUser({password});if(error)throw error;cloud.mode='login';const {data}=await cloud.api.auth.getSession();await cloudEnter(data.session)}else if(cloud.mode==='signup'){const redirect=cloudRedirect();if(!redirect)throw Error('Abra a versão publicada para criar o acesso e receber o link de confirmação correto.');const {error}=await cloud.api.auth.signUp({email,password,options:{emailRedirectTo:redirect}});if(error)throw error;cloud.mode='login';cloudAuth('Se o cadastro puder ser criado, você receberá um e-mail. Confirme o link e depois entre com sua senha.')}else{const {data,error}=await cloud.api.auth.signInWithPassword({email,password});if(error)throw error;await cloudEnter(data.session)}}catch(e){cloudMessage(cloudError(e),true)}finally{if(submit.isConnected)submit.disabled=false}}
async function cloudForgot(){const email=document.querySelector('#cloudEmail')?.value.trim(),redirect=cloudRedirect();if(!cloud.api)return;if(!email||!document.querySelector('#cloudEmail').checkValidity()){cloudMessage('Preencha seu e-mail válido para recuperar a senha.',true);return}if(!redirect){cloudMessage('Abra o endereço publicado da central para recuperar a senha.',true);return}try{const {error}=await cloud.api.auth.resetPasswordForEmail(email,{redirectTo:redirect});if(error)throw error;cloudMessage('Se o e-mail estiver cadastrado, você receberá um link para redefinir a senha.')}catch(e){cloudMessage(cloudError(e),true)}}
function cloudClear(){cloud.epoch++;incidentRows=[];incidentUser='';incidentState='idle';incidentPending=null;clearInterval(cloud.timer);cloud.user=null;cloud.member=null;cloud.team=[];cloud.allowed=[];cloud.meta.clear();cloud.baseline=null;cloud.pending=null;db=blank();filters={client:'',account:'',priority:''};dailyAccount='';query='';document.querySelector('#search').value='';if(document.querySelector('#modal').open)document.querySelector('#modal').close();cloudSetBusy(false);cloudAuth()}
async function cloudLogout(){if(cloud.pending||incidentPending||incidentBusy){toast('Há um salvamento sem confirmação. Use “Confirmar salvamento” antes de sair.',true);return}try{const {error}=await cloud.api.auth.signOut({scope:'local'});if(error)throw error;cloudClear()}catch(e){toast(cloudError(e),true)}}
function cloudApply(snapshot){if(!snapshot?.member||!Array.isArray(snapshot.records)||!Array.isArray(snapshot.team))throw Error('Resposta incompleta do banco.');const next=blank(),meta=new Map();for(const row of snapshot.records){if(!CLOUD_TYPES.includes(row.kind))continue;next[row.kind].push({...row.payload,id:row.id});meta.set(row.id,row)}validateData(next);cloud.member=snapshot.member;cloud.team=snapshot.team;cloud.allowed=snapshot.allowed||[];cloud.meta=meta;db=next;cloud.baseline=clone(next)}
async function cloudEnter(session){if(!session){cloudClear();return}if(cloud.loading)return;cloud.loading=true;cloud.user=session.user;const epoch=++cloud.epoch;try{const {error}=await cloud.api.rpc('ac_bootstrap');if(error)throw error;const {data,error:readError}=await cloud.api.rpc('ac_snapshot');if(readError)throw readError;if(epoch!==cloud.epoch)return;cloudApply(data);document.body.classList.add('cloud-ready');view=cloud.member.role==='admin'?'dashboard':'daily';render();cloudDecorate();clearInterval(cloud.timer);cloud.timer=setInterval(()=>cloudPull(false),15000)}catch(e){if(epoch===cloud.epoch)cloudAuth(cloudError(e),true)}finally{cloud.loading=false}}
async function cloudPull(manual=false){if(!cloud.member||cloud.busy||cloud.loading||cloud.pending||document.querySelector('#modal').open)return;if(!manual&&(document.hidden||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)))return;cloud.loading=true;cloudSetBusy(true);const epoch=cloud.epoch;try{const {data,error}=await cloud.api.rpc('ac_snapshot');if(error)throw error;if(epoch!==cloud.epoch)return;cloudApply(data);render();cloudDecorate();if(manual)toast('Dados atualizados.')}catch(e){document.querySelector('#storageStatus').textContent='Atualização indisponível';if(manual)toast(cloudError(e),true)}finally{cloud.loading=false;cloudSetBusy(false)}}
function cloudChanges(){const changes=[];for(const kind of CLOUD_TYPES){const before=new Map((cloud.baseline?.[kind]||[]).map(r=>[r.id,r])),now=new Map(db[kind].map(r=>[r.id,r]));for(const row of now.values()){if(JSON.stringify(row)===JSON.stringify(before.get(row.id)))continue;const meta=cloud.meta.get(row.id);changes.push({action:'save',kind,id:row.id,version:meta?.version||0,owner_id:row._assignee||meta?.owner_id||cloud.user.id,payload:row})}for(const old of before.values())if(!now.has(old.id))changes.push({action:'delete',kind,id:old.id,version:cloud.meta.get(old.id)?.version||0})}return changes}
async function cloudPersist(message='Registro salvo online.'){if(!cloud.member||cloud.busy||cloud.loading){if(cloud.baseline)db=clone(cloud.baseline);toast('Aguarde a conexão terminar antes de salvar.',true);return false}if(cloud.pending){db=clone(cloud.baseline);toast('Confirme o salvamento pendente antes de fazer outra alteração.',true);return false}try{validateData(db)}catch(e){db=clone(cloud.baseline);toast('Revise os dados: '+cloudError(e),true);return false}const changes=cloudChanges();if(!changes.length)return true;cloud.pending={p_request:uid(),p_changes:clone(changes)};return cloudCommitPending(message)}
async function cloudCommitPending(message='Salvamento confirmado.'){if(!cloud.pending||cloud.busy)return false;cloudSetBusy(true);const epoch=cloud.epoch;try{const {data,error}=await cloud.api.rpc('ac_commit',cloud.pending);if(error)throw error;if(epoch!==cloud.epoch)return false;cloudApply(data);cloud.pending=null;cloudDecorate();toast(message);return true}catch(e){if(epoch!==cloud.epoch)return false;db=clone(cloud.baseline);const definite=Boolean(e?.code)&&!String(e.code).startsWith('08');if(definite)cloud.pending=null;const conflict=String(e.message).includes('CONFLICT:');if(conflict){if(document.querySelector('#modal').open)document.querySelector('#modal').close();try{const {data,error}=await cloud.api.rpc('ac_snapshot');if(!error)cloudApply(data)}catch{}}toast(conflict?'Outra pessoa alterou este registro. Os dados foram atualizados; abra-o e revise sua alteração.':cloudError(e)+(cloud.pending?' Use “Confirmar salvamento” para verificar o resultado.':''),true);cloudDecorate();return false}finally{cloudSetBusy(false)}}
function cloudDecorate(){if(!cloud.member)return;const manager=cloud.member.role==='admin',note=document.querySelector('.local-note');note.innerHTML=`<strong>${esc(cloud.member.full_name)}</strong>${manager?'Gestor · visão da equipe':'Account · minha carteira'}<div class="storage-status" id="storageStatus">${cloud.pending?'Salvamento sem confirmação':'Conectado ao Supabase'}</div><div class="cloud-tools"><button class="btn" data-cloud="refresh">Atualizar</button>${cloud.pending?'<button class="btn" data-cloud="retry">Confirmar salvamento</button>':''}<button class="btn" data-cloud="logout">Sair</button></div>`;document.querySelector('.topbar>.avatar').textContent=initials(cloud.member.full_name);document.querySelectorAll('.footer-note span:last-child').forEach(e=>e.textContent='Base online · atualização a cada 15 segundos');if(view==='daily'){const help=document.querySelector('#content>p.help');if(help)help.textContent='Altere a data para planejar ou consultar o histórico. Os registros são salvos online e ficam disponíveis para o gestor.'}if(cloud.pending&&!document.querySelector('.cloud-banner'))document.querySelector('#content').insertAdjacentHTML('afterbegin','<div class="cloud-banner">Há um salvamento sem confirmação. Evite fechar a página até verificar o resultado. <button class="btn small" data-cloud="retry">Confirmar salvamento</button></div>')}
function cloudExportLocal(){try{const raw=localStorage.getItem(KEY);if(!raw){toast('Não há dados da versão local neste navegador.',true);return}download(raw,'accounts-backup-local-'+today()+'.json')}catch{toast('Não foi possível ler os dados locais.',true)}}
function renderCloudSettings(){const admin=cloud.member?.role==='admin';return `<div class="settings-grid">${panel('Dados online',`<div class="panel-body"><p>Os registros são salvos no Supabase. Você está conectado como ${esc(cloud.member?.full_name)} (${admin?'gestor':'Account'}). A central busca atualizações a cada 15 segundos enquanto está aberta, sem interromper formulários em edição.</p><div class="actions">${button('Atualizar agora','cloud-refresh')}${button('Exportar meus dados visíveis','export')}${button('Importar backup local','import')}</div><p>Importações adicionam registros, sem substituir a base existente. Dados de demonstração não são importados.</p></div>`)}${panel('Versão anterior',`<div class="panel-body"><p>Os registros antigos deste navegador foram preservados. Exporte-os antes de migrar e importe o backup na conta que ficará responsável por eles.</p><button class="btn" data-cloud="local-backup">Exportar backup local</button><p>Ao importar, todos os registros ficam vinculados ao usuário conectado. Para migrar a carteira de um Account, faça a importação com o login desse Account.</p></div>`)}${admin?panel('Acessos da equipe',`<div class="panel-body"><p>Autorize o e-mail do Account. Depois, ele acessa o link da central, escolhe “Primeiro acesso” e confirma o e-mail. Somente usuários autorizados podem ler ou salvar registros.</p><button class="btn primary" data-cloud="authorize">Autorizar Account</button>${cloud.allowed.map(a=>`<div class="access-row"><div><strong>${esc(a.full_name)}</strong><small>${esc(a.email)}</small><small>${a.role==='admin'?'Gestor':cloud.team.some(m=>m.email===a.email)?'Account cadastrado':'Aguardando primeiro acesso'} · ${a.active?'Autorizado':'Bloqueado'}</small></div>${a.role!=='admin'?`<button class="btn small" data-cloud="toggle-access" data-email="${esc(a.email)}">${a.active?'Bloquear':'Reativar'}</button>`:''}</div>`).join('')}</div>`):''}</div>`}
function cloudAuthorize(){showModal(`<form id="authorizeForm">${modalHead('Autorizar Account')}<div class="modal-body"><label class="field">Nome<input name="name" maxlength="120" required></label><label class="field" style="margin-top:16px">E-mail<input name="email" type="email" required></label><p class="help">Este cadastro autoriza o acesso. O Account cria sua própria senha em “Primeiro acesso”.</p><p class="field-error" id="accessError" role="alert"></p></div><div class="modal-footer"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Autorizar</button></div></form>`);document.querySelector('#authorizeForm .modal-head button').type='button';document.querySelector('#authorizeForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const ok=await cloudSetAccess(String(fd.get('email')),String(fd.get('name')),true);if(ok)document.querySelector('#modal').close()}}
async function cloudSetAccess(email,name,active){if(cloud.busy)return false;cloudSetBusy(true);try{const {data,error}=await cloud.api.rpc('ac_authorize_account',{p_email:email,p_name:name,p_active:active});if(error)throw error;cloudApply(data);render();toast(active?'Acesso autorizado.':'Acesso bloqueado.');return true}catch(e){toast(cloudError(e),true);return false}finally{cloudSetBusy(false)}}
async function cloudImport(next){if(next.demo){toast('Este backup contém dados de demonstração. Use um backup com os dados reais.',true);return}const total=CLOUD_TYPES.reduce((s,k)=>s+next[k].length,0);if(!total){toast('O backup está vazio.',true);return}if(total>500){toast('Importe até 500 registros por vez. Para bases maiores, faça uma migração assistida.',true);return}confirmModal('Adicionar registros do backup?',`${total} registros serão adicionados à carteira de ${cloud.member.full_name}. A base atual será preservada. Importar o mesmo arquivo novamente criará cópias.`,'Adicionar registros',async()=>{const ids=new Map(CLOUD_TYPES.flatMap(k=>next[k].map(r=>[r.id,uid()])));for(const kind of CLOUD_TYPES)for(const r of next[kind]){const row={...r,id:ids.get(r.id)};if(row.client)row.client=ids.get(row.client)||row.client;if(row.sourceMeeting)row.sourceMeeting=ids.get(row.sourceMeeting)||row.sourceMeeting;delete row._assignee;db[kind].push(row)}const ok=await persist('Backup importado para sua carteira.');render();return ok})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cloud]');if(!b||cloud.busy)return;const action=b.dataset.cloud;if(action==='logout')await cloudLogout();else if(action==='refresh')await cloudPull(true);else if(action==='local-backup')cloudExportLocal();else if(action==='retry'){const ok=await cloudCommitPending();if(ok&&document.querySelector('#modal').open)document.querySelector('#modal').close();render()}else if(action==='authorize')cloudAuthorize();else if(action==='toggle-access'){const a=cloud.allowed.find(a=>a.email===b.dataset.email);if(a)confirmModal(a.active?'Bloquear acesso?':'Reativar acesso?',`${a.full_name} ${a.active?'deixará de acessar':'poderá acessar'} os registros online. Os registros existentes serão mantidos.`,a.active?'Bloquear':'Reativar',()=>cloudSetAccess(a.email,a.full_name,!a.active))}});

function validateData(data){
 if(!data||data.version!==1||typeof data.demo!=='boolean')throw Error('Formato de backup inválido.');
 if(data.daily===undefined)data.daily=[];
 if(!Array.isArray(data.daily)||data.daily.length>20000)throw Error('Lista de prioridades inválida.');
 const dailyIds=new Set();for(const r of data.daily){if(!r||['id','title','account','date'].some(k=>typeof r[k]!=='string'||!r[k].trim())||dailyIds.has(r.id)||!priorities.includes(r.priority)||!['Pendente','Concluída'].includes(r.status)||typeof r.notes!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||Number.isNaN(localDate(r.date).getTime())||dateISO(localDate(r.date))!==r.date)throw Error('Prioridade diária inválida.');dailyIds.add(r.id)}
 const types=['clients','tasks','communications','meetings','campaigns','promotions','metrics','documents'];
 for(const type of types){if(!Array.isArray(data[type])||data[type].length>20000)throw Error('Lista inválida: '+type);const ids=new Set();for(const r of data[type]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id||ids.has(r.id))throw Error('Registros inválidos em '+type);ids.add(r.id);for(const [k,v] of Object.entries(r)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Campo inválido.');if(k==='checks'){if(!Array.isArray(v)||v.length!==8||v.some(x=>typeof x!=='boolean'))throw Error('Checklist inválido.')}else if(!['string','number','boolean'].includes(typeof v)||typeof v==='number'&&!Number.isFinite(v))throw Error('Valor inválido.');}if(typeof r[type==='clients'||['campaigns','promotions','metrics','documents'].includes(type)?'name':'title']!=='string')throw Error('Registro sem título.');}}
 const required={clients:['name','account'],tasks:['title','client','owner','executor','due'],communications:['title','client','date','summary'],meetings:['title','client','date','time'],campaigns:['name','client','start','end','owner'],promotions:['name','client','start','end','owner','offer'],metrics:['name','client','period'],documents:['name','client','url']};
 for(const type of types)for(const r of data[type]){for(const k of required[type])if(typeof r[k]!=='string'||!r[k].trim())throw Error('Campo obrigatório ausente: '+k);for(const k of ['budget','spent','leads','sales','revenue','target','actual','duration','cadence'])if(k in r&&!(k==='target'&&type==='campaigns')&&(typeof r[k]!=='number'||r[k]<0))throw Error('Número inválido: '+k);if(type==='metrics'&&(!/^\d{4}-(0[1-9]|1[0-2])$/.test(r.period)||!['Maior é melhor','Menor é melhor'].includes(r.direction)||!['R$','%','x','un.'].includes(r.unit)))throw Error('Indicador inválido.');if(type==='meetings'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(r.time))throw Error('Horário inválido.');}
 const clients=new Set(data.clients.map(c=>c.id));for(const t of types.filter(x=>x!=='clients'))for(const r of data[t])if(!clients.has(r.client))throw Error('Cliente não encontrado em '+t);
 for(const t of data.tasks)if(!statuses.includes(t.status)||!priorities.includes(t.priority))throw Error('Status de tarefa inválido.');
 for(const p of data.promotions)if(!Array.isArray(p.checks)||p.checks.length!==8)throw Error('Checklist ausente.');
 for(const type of types)for(const r of data[type]){for(const k of ['start','end','due','date','lastContact','followup','updated'])if(r[k]&&(!/^\d{4}-\d{2}-\d{2}$/.test(r[k])||Number.isNaN(localDate(r[k]).getTime())||dateISO(localDate(r[k]))!==r[k]))throw Error('Data inválida.');if(r.url&&!safeURL(r.url))throw Error('Link inválido.');}
 return JSON.parse(JSON.stringify(data));
}
async function persist(message){return cloudPersist(message)}
function toast(msg,error=false){clearTimeout(toastTimer);$('#toast').textContent=msg;$('#toast').className='toast'+(error?' error':'');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),6000)}
function client(id){return db.clients.find(c=>c.id===id)}
function clientName(id){return client(id)?.name||'Cliente removido'}
function initials(s){return String(s||'AC').split(' ').slice(0,2).map(v=>v[0]).join('').toUpperCase()}
function normalize(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function filtered(type){return db[type].filter(r=>{const c=type==='clients'?r:client(r.client);return (!filters.client||(type==='clients'?r.id:r.client)===filters.client)&&(!filters.account||c?.account===filters.account)&&(!filters.priority||type!=='tasks'||r.priority===filters.priority)&&(!query||normalize(Object.values(r).join(' ')+' '+(c?.name||'')).includes(normalize(query)))})}
function openTasks(){return filtered('tasks').filter(t=>t.status!=='Concluída')}
function late(t){return t.due&&t.due<today()&&t.status!=='Concluída'}
function tone(s){return ['Crítico','Alta','Bloqueada','Alto','Atrasada'].includes(s)?'red':['Atenção','Média','Aguardando aprovação','Preparação','Médio','Pausada'].includes(s)?'amber':['Saudável','Concluída','Concluído','Ativa','Aprovada','Baixo','Realizada'].includes(s)?'green':['Em execução','Agendada'].includes(s)?'blue':s==='Em revisão'?'purple':''}
const badge=s=>`<span class="badge ${tone(s)}">${esc(s)}</span>`;
const button=(text,action,cls='',extra='')=>`<button class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`;

function empty(title='Nenhum registro encontrado',desc='Ajuste os filtros ou cadastre um novo registro.',type=''){return `<div class="empty">${icon('tasks')}<strong>${esc(title)}</strong><p>${esc(desc)}</p>${type?button(icon('plus')+' Adicionar registro','new','',`data-type="${type}"`):''}</div>`}

function renderDashboard(){

const SETUP_STATUSES=['Pendente','Em andamento','Concluída'];
let roadmapClient='',roadmapStage='cadastro';
config.metrics=['Mapa de evolução','Setup, checkpoints e prontidão por cliente.'];
function setupRead(c){
 if(!c.setupRoadmap)return {version:1,tasks:{}};
 const state=JSON.parse(c.setupRoadmap);
 if(state.version!==1||!state.tasks||typeof state.tasks!=='object'||Array.isArray(state.tasks))throw Error('Mapa de evolução inválido.');
 const known=new Set(SETUP_STAGES.flatMap(s=>s.tasks.map(t=>s.id+'.'+t[0])));
 for(const [key,t] of Object.entries(state.tasks)){
  if(!known.has(key)||!t||!SETUP_STATUSES.includes(t.status)||['owner','due','notes','completedAt'].some(k=>typeof t[k]!=='string'))throw Error('Checkpoint inválido.');
  if(t.owner.length>120||t.notes.length>600)throw Error('Texto do checkpoint excede o limite.');
  for(const k of ['due','completedAt'])if(t[k]&&(!/^\d{4}-\d{2}-\d{2}$/.test(t[k])||dateISO(localDate(t[k]))!==t[k]))throw Error('Data do checkpoint inválida.');
 }
 return state;
}
function setupTask(c,s,t){return setupRead(c).tasks[s+'.'+t]||{status:'Pendente',owner:c.account||'',due:'',notes:'',completedAt:''}}
function setupProgress(c,stages=SETUP_STAGES){
 const list=stages.flatMap(s=>s.tasks.map(t=>setupTask(c,s.id,t[0])));
 const done=list.filter(t=>t.status==='Concluída').length;
 return {done,total:list.length,pct:Math.round(done/list.length*100),late:list.filter(t=>t.due&&t.due<today()&&t.status!=='Concluída').length};
}
function setupGate(c,ids){return ids.every(key=>{const [s,t]=key.split('.');return setupTask(c,s,t).status==='Concluída'})}
function setupReadiness(c){
 const base=setupProgress(c,SETUP_STAGES.slice(0,5)).pct===100;
 return {base,creators:base&&setupGate(c,['creators.auto','creators.aberta','creators.adsrate','creators.amostras']),
 ads:base&&setupGate(c,['ads.infra','ads.conexao','ads.pagamento','ads.criativos','ads.campanha','ads.limites'])};
}
function setupBadges(c){const r=setupReadiness(c);return '<div class="actions">'+badge(r.base?'Base pronta':'Setup pendente')+badge(r.creators?'Pronta para Creators':'Preparar Creators')+badge(r.ads?'Pronta para Ads':'Preparar Ads')+'</div>'}

  try{const p=setupProgress(c);return '<article class="client-card"><div class="eyebrow">'+esc(c.account)+'</div><h2>'+esc(c.name)+'</h2><p class="subtitle">'+p.done+' de '+p.total+' checkpoints · '+p.pct+'%</p><div class="track"><span style="width:'+p.pct+'%"></span></div>'+setupBadges(c)+'<p class="help">'+(p.late?p.late+' checkpoint(s) com prazo vencido':'Sem prazos vencidos')+'</p><button class="btn primary" data-roadmap="open" data-client="'+esc(c.id)+'">Abrir trilha →</button></article>'}
  catch{return '<article class="client-card"><h2>'+esc(c.name)+'</h2><p>Não foi possível ler esta trilha. Exporte o backup e peça a revisão dos dados. Nada foi sobrescrito.</p></article>'}
 }).join('')+'</div>'+roadmapHistory();
 const c=selected,s=SETUP_STAGES.find(s=>s.id===roadmapStage)||SETUP_STAGES[0],p=setupProgress(c),sp=setupProgress(c,[s]);
 return '<button class="btn small" data-roadmap="back">← Todas as trilhas</button><section class="panel roadmap-intro"><div class="panel-head"><div><div class="eyebrow">'+esc(c.account)+'</div><h2>'+esc(c.name)+'</h2><p>'+p.done+'/'+p.total+' checkpoints concluídos · '+p.pct+'%</p></div><strong class="roadmap-percent">'+p.pct+'%</strong></div><div class="track"><span style="width:'+p.pct+'%"></span></div>'+setupBadges(c)+'<p class="help">Prontidão interna: base = etapas 1–5; Creators = base + condições, comissão e amostras; Ads = base + infraestrutura, pagamento, criativos, campanha e limites. Não depende de primeiras vendas. Marcar aqui não ativa campanhas.</p></section><div class="roadmap-layout"><nav class="panel roadmap-nav" aria-label="Etapas de setup">'+SETUP_STAGES.map((stage,i)=>{const a=setupProgress(c,[stage]);return '<button data-roadmap="stage" data-stage="'+stage.id+'" class="roadmap-step '+(s.id===stage.id?'selected':'')+'" '+(s.id===stage.id?'aria-current="step"':'')+'><span class="roadmap-number">'+(a.pct===100?'✓':String(i+1).padStart(2,'0'))+'</span><span>'+esc(stage.short)+'<small>'+a.done+'/'+a.total+' concluídos</small></span></button>'}).join('')+'</nav><section class="panel roadmap-stage"><div class="eyebrow">'+esc(s.phase)+'</div><h2>'+esc(s.title)+'</h2><p class="subtitle">'+esc(s.goal)+'</p><p class="help">Apoio sugerido: '+esc(s.owner)+'</p><p class="help"><strong>Pré-requisitos:</strong> '+esc(s.needs)+'</p><div class="track"><span style="width:'+sp.pct+'%"></span></div><p class="help">'+sp.done+' de '+sp.total+' checkpoints nesta etapa</p>'+s.tasks.map(t=>{const r=setupTask(c,s.id,t[0]);return '<article class="roadmap-task"><div><h3>'+esc(t[1])+'</h3><p class="help">'+esc(t[2])+'</p><div class="actions">'+badge(r.status)+(r.due&&r.due<today()&&r.status!=='Concluída'?badge('Atrasada'):'')+'</div><p class="meta">'+esc(r.owner||'Responsável não definido')+' · Prazo: '+date(r.due)+(r.completedAt?' · Concluído: '+date(r.completedAt):'')+'</p>'+(r.notes?'<p class="help roadmap-notes">'+esc(r.notes)+'</p>':'')+'</div><button class="btn small" data-roadmap="edit" data-client="'+esc(c.id)+'" data-stage="'+s.id+'" data-task="'+t[0]+'">Atualizar</button></article>'}).join('')+'<div class="roadmap-ready"><strong>Critério de conclusão da etapa</strong><p class="help">'+esc(s.ready)+'</p></div><p class="help">Trilha baseada no guia de setup fornecido pela equipe. Confirme requisitos e disponibilidade no painel atual da plataforma.</p></section></div>'+roadmapHistory();
}
function roadmapHistory(){return db.metrics.length?'<details class="panel roadmap-history"><summary>Indicadores anteriores — histórico preservado</summary>'+renderMetrics()+'</details>':''}
function editCheckpoint(clientId,stageId,taskId){
 const c=client(clientId),s=SETUP_STAGES.find(s=>s.id===stageId),t=s?.tasks.find(t=>t[0]===taskId);if(!c||!t)return;
 const state=setupRead(c),r=setupTask(c,stageId,taskId);
 showModal('<form id="checkpointForm">'+modalHead(t[1])+'<div class="modal-body"><p class="subtitle">'+esc(c.name)+' · '+esc(s.short)+'</p><div class="form-grid">'+formHTML(field('status','Status','select',{options:SETUP_STATUSES}),r.status)+formHTML(field('owner','Responsável','text',{required:true}),r.owner)+formHTML(field('due','Prazo','date'),r.due)+formHTML(field('notes','Observações','textarea',{wide:true}),r.notes)+'</div><p class="help">Conclua somente após conferir a entrega. A data de conclusão é registrada automaticamente. Não registre senhas ou documentos pessoais.</p><p id="checkpointError" class="field-error" role="alert"></p></div><div class="modal-footer"><button type="button" class="btn" data-action="close">Cancelar</button><button type="submit" class="btn primary">Salvar checkpoint</button></div></form>');
 $('#checkpointForm .modal-head button').type='button';$('#field-owner').maxLength=120;$('#field-notes').maxLength=600;
 $('#checkpointForm').onsubmit=async e=>{
  e.preventDefault();if(cloud.busy||cloud.loading||cloud.pending){$('#checkpointError').textContent='Aguarde ou confirme o salvamento pendente antes de continuar.';return}
  const fd=new FormData(e.target),status=String(fd.get('status')),next={status,owner:String(fd.get('owner')).trim(),due:String(fd.get('due')),notes:String(fd.get('notes')).trim(),completedAt:status==='Concluída'?(r.completedAt||today()):''};
  if(!next.owner){$('#checkpointError').textContent='Informe o responsável.';return}
  const updated={...state,tasks:{...state.tasks,[stageId+'.'+taskId]:next}},encoded=JSON.stringify(updated);
  try{setupRead({...c,setupRoadmap:encoded})}catch(err){$('#checkpointError').textContent=err.message;return}
  const current=client(clientId);if(!current)return;current.setupRoadmap=encoded;
  const ok=await persist('Checkpoint salvo online.');if(ok){$('#modal').close();render()}else if($('#checkpointError'))$('#checkpointError').textContent='Não foi possível confirmar. Confira o aviso e tente novamente após atualizar.';
 };
}

config.guide=['Guia do Account','Como transformar organização em evolução do cliente.'];
navGroups.find(g=>g[0]==='Gestão')[1].push(['guide','docs']);
const ACCOUNT_GUIDE=[
 {title:'Primeiros passos',area:'dashboard',label:'Abrir visão geral',body:`<p>Use sempre o endereço online da central, com seu login individual autorizado pelo gestor. O Account acessa sua carteira; o gestor acompanha os registros da equipe. Não compartilhe senhas.</p><ol><li>Confira seu nome na lateral e a indicação de conexão ao Supabase.</li><li>Abra a visão geral e revise prazos, contatos e pendências.</li><li>Use busca e filtros para localizar uma conta. Se algo não aparecer, limpe os filtros antes de cadastrar novamente.</li><li>Ao salvar, aguarde a confirmação. Estar conectado não significa que um salvamento específico foi concluído.</li></ol><p>O sistema consulta atualizações a cada 15 segundos quando pode fazê-lo sem interromper a edição. Use <strong>Atualizar</strong> para buscar os dados mais recentes, após fechar os formulários.</p>`},
 {title:'Cadastro e gestão da carteira',area:'clients',label:'Abrir minha carteira',body:`<p>Cadastre cada cliente uma única vez. Preencha nome reconhecível, segmento, contato principal, objetivo, orçamento e cadência de contato. Mantenha o diagnóstico e as observações atualizados.</p><div class="guide-example"><strong>Objetivo útil</strong><p>Preparar a loja para o piloto com três produtos, estoque conferido, margem validada e responsáveis definidos até a data combinada com o cliente.</p></div><p>Evite objetivos vagos como “vender mais”. Registre resultado esperado, contexto e prazo nas áreas apropriadas. A saúde da conta deve refletir evidências, não apenas a impressão da última conversa.</p><p>O responsável define a carteira de acesso. A troca de responsável em um registro existente não é feita pelo formulário comum: peça ao gestor para coordenar a transferência. Não duplique o cliente para contornar permissões.</p>`},
 {title:'Sua rotina diária',area:'daily',label:'Organizar prioridades',body:`<h3>Ao começar · sugestão de 10 minutos</h3><p>Revise atrasos e bloqueios, confira reuniões e escolha de três a cinco prioridades realistas. Dê preferência ao que libera o trabalho de outras pessoas ou evita impacto ao cliente.</p><h3>Durante o dia</h3><p>Registre decisões após os contatos, acompanhe entregas e atualize as tarefas que mudaram de situação. Se depender de alguém, deixe explícito quem precisa agir e qual é o próximo retorno.</p><h3>Ao encerrar · sugestão de 10 minutos</h3><p>Marque apenas o que foi entregue, registre o motivo das pendências e planeje o dia seguinte. Troque a data em Prioridades do dia para consultar ou planejar outro dia. Evite alterar datas antigas só para esconder uma pendência.</p><div class="guide-example"><strong>Regra de trabalho</strong><p>Cada cliente deve ter um próximo passo claro, com responsável e prazo. Cada conclusão deve representar uma entrega conferida.</p></div>`},
 {title:'Prioridades do dia × Plano de ação',area:'tasks',label:'Abrir plano de ação',body:`<p><strong>Prioridades do dia</strong> é seu foco pessoal: o que você vai executar naquela data. <strong>Plano de ação</strong> é o compromisso de entrega para um cliente, com executor, prazo, status e dependências.</p><p>Exemplo: a ação da conta é “Publicar três vídeos aprovados até sexta”. Sua prioridade de hoje pode ser “Revisar os três roteiros e solicitar aprovação”. Inclua o nome do cliente no título da prioridade, pois ela não tem um vínculo próprio com a conta.</p><p>Essas áreas não se atualizam automaticamente entre si. Concluir sua revisão do dia não significa que a publicação foi entregue. Atualize cada registro de acordo com o que realmente aconteceu.</p><p>Use prioridade Alta para impacto ou urgência reais. Se tudo for Alta, a equipe perde a referência do que fazer primeiro.</p>`},
 {title:'Mapa de evolução e setup',area:'metrics',label:'Abrir mapa de evolução',body:`<p>Cada cliente novo ou já cadastrado tem uma trilha de <strong>10 etapas e 56 checkpoints</strong>. Abra por Gestão → Mapa de evolução ou pelo botão Ver trilha na carteira.</p><ol><li>Selecione o cliente e a etapa.</li><li>Leia o objetivo, os pré-requisitos e o critério de conclusão.</li><li>Clique em Atualizar no checkpoint e defina responsável, prazo e observações.</li><li>Use Pendente, Em andamento ou Concluída. A data de conclusão é registrada ao concluir; reabrir remove essa data.</li></ol><p>Se houver impedimento, mantenha a tarefa pendente ou em andamento e registre nas observações: o que falta, de quem depende e quando haverá retorno. O checkpoint não possui um status próprio de bloqueio.</p><p>A base considera as etapas 1–5. Creators acrescenta condições de colaboração, comissão e amostras. Ads acrescenta infraestrutura, pagamento, criativos, campanha e limites. Conteúdo, Creators e Ads podem avançar em paralelo; as primeiras vendas não são pré-requisito para iniciar anúncios.</p><p><strong>Importante:</strong> prontidão é um controle interno informado pela equipe. Marcar a trilha não configura o TikTok, não ativa anúncios e não comprova desempenho. Confira as entregas e as regras atuais da plataforma. O mapa e o Plano de ação também são registros separados.</p>`},
 {title:'Comunicação e reuniões que geram ação',area:'communications',label:'Registrar comunicação',body:`<p>Registre o que muda a condução da conta: aprovações, decisões, mudanças de escopo, problemas e combinados. Evite copiar conversas inteiras sem resumir o que precisa acontecer.</p><div class="guide-example"><strong>Modelo de registro</strong><p>Contexto: catálogo aguardava revisão.<br>Decisão: cliente aprovou os produtos A e B; C precisa de novas fotos.<br>Responsável: conteúdo produz as fotos; Account valida com o cliente.<br>Prazo: quinta-feira, 15h.<br>Próximo passo: enviar a nova ficha e registrar o retorno.</p></div><p>Antes de uma reunião, registre pauta, participantes e link. Depois, registre ata, decisões e próximos passos. Quando houver decisão registrada, “Transformar decisão em ação” abre uma tarefa para revisão: complete executor e prazo e salve. O botão não substitui essa conferência.</p><p>Combine o retorno com o cliente e registre a data. O CRM não envia mensagens de WhatsApp ou e-mails automaticamente.</p>`},
 {title:'Delegar e acompanhar executores',area:'executions',label:'Abrir execuções',body:`<p>Uma boa tarefa responde: <strong>o que entregar, por quê, quem executa, até quando e como será aprovada</strong>. Inclua materiais de referência em Documentos e links ou nas observações.</p><div class="guide-example"><strong>Evite: “Ver os creators”</strong><p>Prefira: “Selecionar 10 creators aderentes ao produto X, registrar os contatos e enviar a lista para revisão até sexta-feira”. Critério: lista com perfil, justificativa de aderência e situação do contato.</p></div><p>Use Planejada antes do início, Em execução durante a produção, Em revisão quando a entrega estiver sendo conferida e Aguardando aprovação quando faltar aprovação. Use Bloqueada com a dependência e o impedimento descritos. Conclua apenas depois de validar a entrega.</p><p>Plano de ação e Execuções mostram as mesmas tarefas em formatos diferentes. Já escrever o nome do executor não cria login, não concede acesso e não envia notificação. Combine a delegação pelo canal da equipe e mantenha o registro atualizado.</p><p>Ao mudar um prazo, anote motivo e novo combinado. Não deixe uma tarefa bloqueada sem uma próxima cobrança ou decisão.</p>`},
 {title:'Ads, promoções e saúde da conta',area:'campaigns',label:'Abrir Ads e campanhas',body:`<p>Registre campanhas com objetivo, período, orçamento, responsável e próxima otimização. Os investimentos e resultados são preenchidos manualmente: a central não busca dados das plataformas de anúncios.</p><p>Compare períodos equivalentes. Evite cadastrar a mesma campanha e período em duplicidade, pois os totais somam os registros. Use uma identificação consistente, como “Produto A · Piloto · Outubro”.</p><p>Em Promoções, confira oferta, datas, responsável e checklist antes de marcar a campanha como publicada. Uma marcação no CRM não publica a promoção na plataforma.</p><p>Em Saúde das contas, avalie satisfação, comunicação, resultados e aprovações com fatos. Registre risco, motivo e ação de recuperação. Se houver mudança relevante de escopo, verba ou entrega, alinhe com o gestor antes de assumir o compromisso.</p><p>Os indicadores anteriores permanecem no histórico do Mapa de evolução. Percentual de setup mede tarefas concluídas, não crescimento de vendas.</p>`},
 {title:'Salvamento, segurança e recuperação',area:'settings',label:'Abrir dados e backup',body:`<p>Os dados operacionais são salvos no Supabase; o GitHub hospeda o código da central. Não registre senhas, tokens, documentos pessoais completos ou dados desnecessários. Use links de pastas com acesso restrito e evite links públicos para materiais confidenciais.</p><h3>Se o salvamento não for confirmado</h3><ol><li>Leia o aviso e confira sua conexão.</li><li>Se aparecer Confirmar salvamento, use essa opção antes de repetir o cadastro ou fechar a página.</li><li>Se outra pessoa editou o registro, abra a versão atualizada, revise e refaça a alteração necessária.</li><li>Se o erro persistir, avise o gestor com a mensagem e a operação que tentou realizar, sem enviar senhas.</li></ol><p>Não use o CRM como se fosse uma ferramenta offline. Preserve anotações ainda não salvas quando houver falha de conexão. Não faça novos cadastros para tentar “forçar” um salvamento.</p><p>Em Dados e backup, a exportação inclui seus dados visíveis. Guarde o arquivo com cuidado. A importação <strong>adiciona registros</strong>, não mescla nem restaura por cima: importar o mesmo arquivo novamente pode duplicar a carteira. Combine migrações com o gestor.</p><p>Se aparecer “e-mail ainda não foi autorizado”, peça ao gestor para conferir o mesmo e-mail e o acesso ativo. Criar o login e autorizar o Account são etapas distintas.</p>`},
 {title:'Checklists diário e semanal',area:'approvals',label:'Revisar pendências',body:`<h3>Antes de encerrar o dia</h3><ul><li>Revisei minhas prioridades e registrei o que ficou pendente.</li><li>Atualizei as entregas e conferi os salvamentos.</li><li>Registrei decisões e aprovações recebidas.</li><li>Deixei responsável, prazo e próximo retorno nos bloqueios.</li><li>Preparei as prioridades do dia seguinte.</li></ul><h3>Na revisão semanal da carteira</h3><ul><li>Todo cliente tem um próximo passo definido?</li><li>Há conta sem contato recente ou sem reunião necessária?</li><li>Quais checkpoints de setup estão parados e por quê?</li><li>As tarefas atrasadas têm um novo combinado registrado?</li><li>Campanhas, ofertas, orçamento e resultados estão atualizados?</li><li>Riscos e oportunidades estão descritos com evidências?</li><li>O gestor sabe quais decisões dependem dele?</li></ul><div class="guide-example"><strong>Resumo para o gestor</strong><p>Cliente → avanço da semana → impedimento → decisão necessária → responsável e prazo do próximo passo.</p></div><p>Esta é uma lista de consulta, não um formulário de acompanhamento salvo. Use Prioridades do dia e Plano de ação para registrar a execução.</p>`}
];
function renderAccountGuide(){const list=ACCOUNT_GUIDE.filter(s=>!query||normalize(s.title+' '+s.body.replace(/<[^>]*>/g,' ')).includes(normalize(query)));return `<div class="heading"><div><div class="eyebrow">GESTÃO / MANUAL PRÁTICO</div><h1>Guia do Account</h1><p class="subtitle">Use a central como memória da conta e ponto de partida para a próxima ação.</p></div></div><section class="panel guide-welcome"><h2>Organizar → executar → conferir → registrar</h2><p>Uma boa rotina deixa claro o que acontece com cada cliente, quem precisa agir e o que falta para avançar. Consulte os tópicos abaixo ou use a busca no topo.</p><span class="badge">10 tópicos · exemplos · checklists de consulta</span></section><div class="guide-sections">${list.length?list.map(s=>`<details class="panel guide-section" ${query?'open':''}><summary><span class="eyebrow">${String(ACCOUNT_GUIDE.indexOf(s)+1).padStart(2,'0')}</span><h2>${s.title}</h2><span aria-hidden="true">＋</span></summary><div class="guide-body">${s.body}<div class="guide-action">${button(s.label+' →','nav','primary',`data-view="${s.area}"`)}</div></div></details>`).join(''):empty('Nenhum tópico encontrado','Tente outro termo na busca, como prazo, setup ou salvamento.')}</div><p class="help">Manual da central · versão 29/09/2026. As rotinas são recomendações de trabalho; combine prioridades e cadências com o gestor.</p>`}
config.executorErrors=['Erros dos executores','Registre ocorrências e acompanhe as correções.'];
config.accountErrors=['Erros dos Accounts','Quadro privado do gestor.'];
navGroups.find(g=>g[0]==='Operação')[1].push(['executorErrors','approvals']);
let incidentRows=[],incidentState='idle',incidentUser='',incidentPending=null,incidentBusy=false;
function incidentManager(){return cloud.member?.role==='admin'&&cloud.member?.email?.toLowerCase()==='viniciusberteloni@gmail.com'}
async function loadIncidents(){
 if(!cloud.user||incidentBusy)return;const user=cloud.user.id,epoch=cloud.epoch;incidentState='loading';incidentUser=user;incidentRows=[];
 if(['executorErrors','accountErrors'].includes(view))render();
 try{const {data,error}=await cloud.api.from('ac_incidents').select('*').order('created_at',{ascending:false});if(error)throw error;if(cloud.epoch!==epoch)return;incidentRows=data;incidentState='ready'}
 catch(e){if(cloud.epoch!==epoch)return;incidentState='error';toast('Não foi possível carregar as ocorrências. Confira a conexão e se supabase-accounts-ocorrencias.sql foi aplicado.',true)}
 if(['executorErrors','accountErrors'].includes(view))render();
}
function renderIncidents(){
 if(incidentUser!==cloud.user?.id){incidentRows=[];incidentPending=null;incidentState='idle';incidentUser=cloud.user?.id}
 if(incidentState==='idle'){setTimeout(loadIncidents,0)}
 const category=view==='accountErrors'?'account':'executor',rows=incidentRows.filter(r=>r.category===category&&(!query||normalize(Object.values(r.payload).join(' ')).includes(normalize(query))));
 return `<div class="heading"><div><div class="eyebrow">QUALIDADE / ACOMPANHAMENTO</div><h1>${config[view][0]}</h1><p class="subtitle">${category==='account'?'Visível somente para Vinicius Berteloni.':'Cada Account vê seus registros; Vinicius pode acompanhar todos.'}</p></div><div class="actions"><button class="btn" data-incident="refresh">Atualizar</button>${incidentState==='ready'?'<button class="btn primary" data-incident="new">Registrar erro</button>':''}</div></div><p class="help">Descreva fatos, impacto e correção esperada. Evite julgamentos pessoais ou dados sensíveis. Os nomes não concedem acesso nem enviam notificações.</p>${incidentPending?'<div class="notice">Salvamento sem confirmação. Não feche a página.<button class="btn" data-incident="retry">Confirmar salvamento</button></div>':''}${incidentState==='error'?'<div class="notice">Não foi possível carregar. Esta área precisa da configuração supabase-accounts-ocorrencias.sql no Supabase. Se ela já foi aplicada, confira a conexão e clique em Atualizar.</div>':incidentState!=='ready'?'<p>Carregando ocorrências…</p>':`<div class="client-grid">${['Aberto','Em correção','Resolvido'].map(status=>`<section class="panel" style="padding:18px"><h2>${status} · ${rows.filter(r=>r.payload.status===status).length}</h2>${rows.filter(r=>r.payload.status===status).map(r=>{const p=r.payload;return `<article class="roadmap-task"><div><h3>${esc(p.title)}</h3><p class="meta">${esc(p.person)} · ${date(p.date)}</p><p class="help">${esc(p.client?clientName(p.client):'Sem cliente vinculado')}</p>${badge(p.severity)}<p class="help">${esc(p.description)}</p><p class="help">Correção: ${esc(p.correction||'Não definida')}</p><p class="meta">Prazo: ${date(p.due)}</p>${p.notes?`<p class="help">${esc(p.notes)}</p>`:''}<button class="btn small" data-incident="edit" data-id="${esc(r.id)}">Editar / atualizar status</button></div></article>`}).join('')||'<p class="help">Nenhum registro.</p>'}</section>`).join('')}</div>`}`;
}
function editIncident(id=''){
 const category=view==='accountErrors'?'account':'executor';if(category==='account'&&!incidentManager())return;
 if(incidentPending){toast('Confirme o salvamento pendente antes de editar.',true);return}
 const r=incidentRows.find(r=>r.id===id);if(id&&!r)return;
 const p=r?.payload||{date:today(),status:'Aberto',severity:'Média'};
 const fields=[field('title','Resumo do erro','text',{required:true}),field('person',category==='account'?'Account envolvido':'Executor envolvido','text',{required:true}),field('client','Cliente (opcional)','select',{options:[['','Sem cliente vinculado'],...db.clients.map(c=>[c.id,c.name])]}),field('date','Data da ocorrência','date',{required:true}),field('severity','Gravidade','select',{options:priorities.slice().reverse()}),field('status','Status','select',{options:['Aberto','Em correção','Resolvido']}),field('due','Prazo para correção','date'),field('description','O que aconteceu e qual foi o impacto','textarea',{required:true,wide:true}),field('correction','Correção / prevenção e responsável','textarea',{wide:true}),field('notes','Observações e evidências (sem dados sensíveis)','textarea',{wide:true})];
 showModal('<form id="incidentForm">'+modalHead(id?'Atualizar ocorrência':'Registrar ocorrência')+'<div class="modal-body"><div class="form-grid">'+fields.map(f=>formHTML(f,p[f.key]||'')).join('')+'</div><p class="field-error" id="incidentError" role="alert"></p></div><div class="modal-footer"><button type="button" class="btn" data-action="close">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>');
 $('#incidentForm .modal-head button').type='button';$$('#incidentForm textarea').forEach(x=>x.maxLength=2000);
 $('#incidentForm').onsubmit=async e=>{e.preventDefault();if(incidentBusy)return;if(incidentPending){await saveIncident();return}const payload=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,String(v).trim()]));if(payload.status==='Resolvido'&&!payload.correction){$('#incidentError').textContent='Registre a correção antes de resolver.';return}incidentPending={p_id:r?.id||uid(),p_version:r?.version||0,p_category:category,p_payload:payload};await saveIncident()};
}
async function saveIncident(){
 if(!incidentPending||incidentBusy)return;incidentBusy=true;cloudSetBusy(true);const epoch=cloud.epoch;
 try{const {data,error}=await cloud.api.rpc('ac_incidents_save',incidentPending);if(error)throw error;if(epoch!==cloud.epoch)return;incidentRows=incidentRows.filter(r=>r.id!==data.id);incidentRows.unshift(data);incidentPending=null;$('#modal').close();toast('Ocorrência salva online.')}
 catch(e){if(epoch!==cloud.epoch)return;const definite=e.code&&!String(e.code).startsWith('08');if(definite)incidentPending=null;toast(cloudError(e)+(incidentPending?' Use Confirmar salvamento.':''),true);if($('#incidentError'))$('#incidentError').textContent=cloudError(e)}
 finally{incidentBusy=false;cloudSetBusy(false);if(epoch===cloud.epoch)render()}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-incident]');if(!b||incidentBusy)return;const a=b.dataset.incident;if(a==='refresh'){if(incidentPending){toast('Confirme o salvamento pendente.',true);return}loadIncidents()}else if(a==='new')editIncident();else if(a==='edit')editIncident(b.dataset.id);else if(a==='retry')saveIncident()});
window.addEventListener('beforeunload',e=>{if(incidentPending||incidentBusy){e.preventDefault();e.returnValue=''}});
// Os registros locais antigos são preservados exclusivamente para exportação.
cloudInit();
// O salvamento online só começa após autenticação e autorização no banco.
</script>
