name: Verificar atualizacoes do site original

on:
  schedule:
    # Toda segunda-feira, 09:17 no horario de Brasilia (12:17 UTC).
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sincronizacao-semanal-site
  cancel-in-progress: false

jobs:
  verificar:
    name: Comparar original com a copia
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Espelhar site original
        shell: pwsh
        run: ./.github/scripts/sync-site.ps1

      - name: Verificar alteracoes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteracao encontrada."
          fi

      - name: Criar ou atualizar Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/site-sync"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git checkout -B "$branch"
          git add -A
          pwsh ./.github/scripts/gerar-resumo.ps1 \
            -MarkdownPath "$RUNNER_TEMP/resumo-pr.md" \
            -TelegramPath "$RUNNER_TEMP/resumo-telegram.txt" \
            -Title "Atualizacao semanal encontrada no site original"
          git commit -m "Atualiza copia do site original"
          git push --force-with-lease origin "HEAD:${branch}"

          pr_url=$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url')
          if [[ -z "$pr_url" ]]; then
            pr_url=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "Atualizacao semanal disponivel para aprovacao" \
              --body-file "$RUNNER_TEMP/resumo-pr.md")
          fi
          gh pr edit "$pr_url" --body-file "$RUNNER_TEMP/resumo-pr.md"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Pull Request: $pr_url"

      - name: Avisar no Telegram
        if: steps.pr.outputs.pr_url != ''
        shell: pwsh
        env:
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            Write-Warning 'Telegram ainda nao configurado. O Pull Request foi criado normalmente.'
            exit 0
          }

          $summaryPath = Join-Path $env:RUNNER_TEMP 'resumo-telegram.txt'
          $summary = if (Test-Path -LiteralPath $summaryPath) {
            [IO.File]::ReadAllText($summaryPath)
          } else {
            'O site original foi atualizado.'
          }
          $message = "$summary`n$env:PR_URL"
          if ($message.Length -gt 4000) { $message = $message.Substring(0, 3997) + '...' }

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $message
            disable_web_page_preview = $true
          } | ConvertTo-Json

          $url = "https://api.telegram.org/bot$env:TELEGRAM_BOT_TOKEN/sendMessage"
          $response = Invoke-RestMethod -Method Post -Uri $url -ContentType 'application/json' -Body $payload
          if (-not $response.ok) {
            throw 'O Telegram nao confirmou o envio da mensagem.'
          }
